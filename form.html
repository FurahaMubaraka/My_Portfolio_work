<main>
    <section class="allhaveit">
        <h1>Get In Touch</h1>
        <p>Fill out the form below to send me a message or inquire about my services.</p>
    </section>
<form>
        <h1>Client Information</h1>

        <label>Full Name:</label>
        <input type="text" placeholder="Your full name"><br><br>

        <label>Email:</label>
        <input type="email" placeholder="your@email.com"><br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter a password"><br><br>

        <label>Message:</label>
        <textarea placeholder="Tell me about Your Project"></textarea><br><br>

        <label>Service Type:</label>
        <select>
            <optgroup label="Services">
                <option>Web Development</option>
                <option>IT Support</option>
            </optgroup>
        </select><br><br>
        <button type="submit">Send Message</button>

</form>
